spring.application.name=fitbook-api

# Výchozí databáze: H2 v režimu PostgreSQL (běží bez instalace). Pro Postgres viz profil "postgres".
spring.datasource.url=jdbc:h2:mem:fitbook;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Schéma spravuje Flyway, Hibernate ho jen kontroluje
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Chyby ve formátu RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info

fitbook.timezone=Europe/Prague
fitbook.demo-data=true
fitbook.cancellation-deadline=PT2H
# URL služby FitBook Insights (Python). Prázdné = předpovědi vypnuté.
fitbook.insights.url=
